<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquarium Controller Specification</title>
  <style>
    :root {
      --bg-color: #f4f5f7;
      --card-bg: #ffffff;
      --border-color: #2b2b2b;
      --text-main: #1a1a1a;
      --accent: #004080; /* Blueprint Blue */
    }

    body {
      font-family: "Courier New", Courier, monospace, system-ui;
      background-color: var(--bg-color);
      background-image: linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px), 
                        linear-gradient(0deg, rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text-main);
      padding: 30px;
      max-width: 650px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 25px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.8);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 0.95rem;
    }

    h2 {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 0;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 5px;
      margin-bottom: 15px;
    }

    .status {
      font-weight: bold;
      color: var(--accent);
    }

    button {
      background: var(--border-color);
      color: white;
      border: none;
      font-family: inherit;
      padding: 8px 14px;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button:active {
      background: var(--accent);
    }

    input[type="range"] {
      accent-color: var(--accent);
    }

    input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Aquarium Controller Dashboard</h1>

  <!-- Sensor & Status Telemetry -->
  <div class="card">
    <h2>System Status</h2>
    <div class="row">
      <span>Temperature:</span>
      <span class="status"><span id="temp-display">--</span> °C</span>
    </div>
    <div class="row">
      <span>Night Mode:</span>
      <span class="status" id="night-display">--</span>
    </div>
    <div class="row">
      <span>System Alert:</span>
      <span class="status" id="alert-display">Loading...</span>
    </div>
  </div>

  <!-- Manual Controls -->
  <div class="card">
    <h2>Component Controls</h2>
    <div class="row">
      <span>Heater:</span>
      <input type="checkbox" id="heater-toggle">
    </div>
    <div class="row">
      <span>Cooling Fan:</span>
      <input type="checkbox" id="fan-toggle">
    </div>
    <div class="row">
      <span>Filter Pump:</span>
      <input type="checkbox" id="pump-toggle">
    </div>
    <div class="row">
      <span>ATO (Top-Off):</span>
      <input type="checkbox" id="ato-toggle">
    </div>
    <div class="row">
      <span>Light Intensity (<span id="light-val">0</span>%):</span>
      <input type="range" id="light-slider" min="0" max="100" value="0">
    </div>
    <div class="row">
      <span>Auto Feeder:</span>
      <button id="feed-btn">Feed Now</button>
    </div>
  </div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // Replace with your exact Firebase Web Config from Console -> Project Settings
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "aquarium-controller-74c20.firebaseapp.com",
      databaseURL: "https://aquarium-controller-74c20-default-rtdb.firebaseio.com",
      projectId: "aquarium-controller-74c20",
      storageBucket: "aquarium-controller-74c20.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRootRef = ref(db, '/');

    // DOM Elements Mapping
    const tempDisplay = document.getElementById("temp-display");
    const nightDisplay = document.getElementById("night-display");
    const alertDisplay = document.getElementById("alert-display");
    
    const heaterToggle = document.getElementById("heater-toggle");
    const fanToggle = document.getElementById("fan-toggle");
    const pumpToggle = document.getElementById("pump-toggle");
    const atoToggle = document.getElementById("ato-toggle");
    const lightSlider = document.getElementById("light-slider");
    const lightVal = document.getElementById("light-val");
    const feedBtn = document.getElementById("feed-btn");

    // 1. READ DATA (Real-time Firebase Listener)
    onValue(dbRootRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        // Sensors & Telemetry
        if (data.temperature !== undefined) tempDisplay.innerText = data.temperature.toFixed(1);
        if (data.night_mode !== undefined) nightDisplay.innerText = data.night_mode ? "ACTIVE" : "INACTIVE";
        if (data.sound_alert && data.sound_alert.message) {
          alertDisplay.innerText = data.sound_alert.message;
        }
        
        // Component Toggles
        if (data.heater_status !== undefined) heaterToggle.checked = data.heater_status;
        if (data.fan_status !== undefined) fanToggle.checked = data.fan_status;
        if (data.pump_status !== undefined) pumpToggle.checked = data.pump_status;
        if (data.ato_status !== undefined) atoToggle.checked = data.ato_status;
        
        // Light Slider (Sync only if user is not actively dragging it)
        if (data.light_intensity !== undefined && document.activeElement !== lightSlider) {
          lightSlider.value = data.light_intensity;
          lightVal.innerText = data.light_intensity;
        }
      }
    });

    // 2. WRITE DATA (Send commands back to Firebase RTDB)
    heaterToggle.addEventListener("change", (e) => {
      update(dbRootRef, { heater_status: e.target.checked });
    });

    fanToggle.addEventListener("change", (e) => {
      update(dbRootRef, { fan_status: e.target.checked });
    });

    pumpToggle.addEventListener("change", (e) => {
      update(dbRootRef, { pump_status: e.target.checked });
    });

    atoToggle.addEventListener("change", (e) => {
      update(dbRootRef, { ato_status: e.target.checked });
    });

    lightSlider.addEventListener("change", (e) => {
      const val = parseInt(e.target.value);
      lightVal.innerText = val;
      update(dbRootRef, { light_intensity: val });
    });

    feedBtn.addEventListener("click", () => {
      feedBtn.innerText = "Dispensing...";
      feedBtn.disabled = true;
      
      update(dbRootRef, { feed_now: true });

      setTimeout(() => {
        feedBtn.innerText = "Feed Now";
        feedBtn.disabled = false;
      }, 3000);
    });
  </script>
</body>
</html>
